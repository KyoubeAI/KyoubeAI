name: release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

# Never two publishes of the same ref at once, and never cancel one half-way:
# a cancelled run can leave a tag pointing at a partially pushed manifest.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    # The same budget the smoke job in ci.yml needs, doubled: the image is ~3 GB
    # compressed per architecture, nothing is cached on a first run, and a tag
    # push also builds arm64 under QEMU emulation. Without this the job inherits
    # the 6-hour cap.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      # Same cleanup as ci.yml's docker-smoke job: an ubuntu runner does not fit
      # this image's layers (let alone two architectures' worth, exported to the
      # GHA cache with mode=max) without it.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/kyoubeai
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
      - name: Resolve version arg
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          # Both architectures only for a release tag. A routine push to main —
          # a docs commit included — publishes an amd64 `sha-` image, which is
          # what those images are for (testing a commit), and skips an arm64
          # build that costs an hour of QEMU emulation for nothing.
          platforms: ${{ startsWith(github.ref, 'refs/tags/v') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            KYOUBE_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Releases up to 1.11.0 were published to KYOUBE_IMAGE_LEGACY (scripts/lib/host.sh), before the repository moved to the
      # KyoubeAI organization. An install of one of them updates with its own update.sh, which pulls the next release
      # from there, so each release is copied there too until those installs have moved (update.sh switches an
      # install to this image as it updates). GHCR_LEGACY_TOKEN: a personal access token (classic) with
      # write:packages from the account that owns that repository; GHCR goes by the token, not the user name.
      - name: Copy the release to the old image repository
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TOKEN: ${{ secrets.GHCR_LEGACY_TOKEN }}
          TAGS: ${{ steps.meta.outputs.tags }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          [ -n "$TOKEN" ] || { echo "::error::GHCR_LEGACY_TOKEN is not set, so installs of 1.11.0 and older cannot update to this release"; exit 1; }
          echo "$TOKEN" | docker login ghcr.io -u kyoubeai-release --password-stdin
          . scripts/lib/host.sh
          args=()
          for ref in $TAGS; do
            case "${ref##*:}" in sha-*) ;; *) args+=(-t "$KYOUBE_IMAGE_LEGACY:${ref##*:}") ;; esac
          done
          docker buildx imagetools create "${args[@]}" "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kyoubeai:$RELEASE_VERSION"
